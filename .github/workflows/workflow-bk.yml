name: bk tasklfow ci

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read


jobs:
  test:
    if: github.head_ref == `feature/health-service-banzi`
    name: API tests
    runs-on: ubuntu-latest

    steps:
    - name: checkout code
      uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: setup python
      uses: actions/setup-python@v6
      with:
          python-version: '3.12'

    - name: install dependencies
      run: python -m pip install -r requirements.txt

    - name: Run the test
      run: python -m pytest -q
