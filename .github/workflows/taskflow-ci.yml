name: TaskFlow CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency:
    name: Dependency gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed change
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Check the identity dependency pin
        run: python exercises/day06_gate.py check
  test:
    name: API tests
    needs: dependency
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed change
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r exercises/day05-requirements.txt
      - name: Run booking permission tests
        run: python -m pytest -q tests/test_day05_access.py
      - name: Run full test suite
        run: python -m pytest -q
  package:
    name: Package candidate
    needs:
      - dependency
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed change
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build container image
        run: docker build -t taskflow:ci .
