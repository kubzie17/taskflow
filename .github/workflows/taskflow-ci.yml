name: TaskFlow CI

on:
  workflow_dispatch:
  push:
    branches:
      - ci/day02-checks
  pull_request:
    branches:
      - feature/health-service-terry

permissions:
  contents: read

jobs:
  test:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed change
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q
