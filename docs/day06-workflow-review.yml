# FICTIONAL REVIEW EXHIBIT. Keep in docs/. Compare with your own workflow.
# Never activate this exhibit as supplied. Its permission and dependency wiring are disputed.
name: Review candidate
on: pull_request
permissions:
  contents: write
jobs:
  dependency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Inspect dependency proposal
        continue-on-error: true
        run: python exercises/day06_gate.py check --pin-file exercises/day06-proposal.case
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r exercises/day05-requirements.txt
      - run: python -m pytest -q
  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: docker build -t taskflow:review .
