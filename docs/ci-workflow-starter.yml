name: TaskFlow CI

on:
  EVENT_GOES_HERE:

permissions:
  contents: ACCESS_GOES_HERE

jobs:
  test:
    name: API tests
    runs-on: RUNNER_GOES_HERE
    steps:
      - name: Check out proposed change
        uses: OWNER/ACTION@VERSION
        with:
          persist-credentials: false

      - name: Set up Python
        uses: OWNER/ACTION@VERSION
        with:
          python-version: 'VERSION_GOES_HERE'

